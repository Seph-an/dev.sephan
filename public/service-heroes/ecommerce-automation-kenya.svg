<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Connected e-commerce automation for Kenya</title>
  <desc id="desc">A storefront connects orders, M-Pesa payments, inventory, delivery and reporting in one automated flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a18"/><stop offset="1" stop-color="#101827"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6ee7b7"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#94a3b8" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="800" rx="40" fill="url(#bg)"/><rect width="1200" height="800" rx="40" fill="url(#grid)"/>
  <circle cx="600" cy="398" r="122" fill="#10b981" opacity=".08" filter="url(#glow)"/>
  <g fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-dasharray="10 15" opacity=".7"><path d="M324 224 505 342"/><path d="m876 224-181 118"/><path d="M324 576 505 458"/><path d="m876 576-181-118"/></g>
  <g fill="#0f2430" stroke="#64748b" stroke-opacity=".5" stroke-width="3">
    <rect x="135" y="130" width="260" height="188" rx="26"/><rect x="805" y="130" width="260" height="188" rx="26"/><rect x="135" y="482" width="260" height="188" rx="26"/><rect x="805" y="482" width="260" height="188" rx="26"/>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M205 214h120l-13 62H218l-18-92h-25"/><circle cx="235" cy="291" r="7" fill="#6ee7b7"/><circle cx="300" cy="291" r="7" fill="#6ee7b7"/>
    <rect x="879" y="175" width="110" height="102" rx="18"/><path d="M908 213h52m-52 27h35"/>
    <path d="M198 577h130m-108-58h87l34 58-34 58h-87l-34-58z"/><path d="M246 539v76m43-76v76"/>
    <path d="M875 618V526m47 92v-57m47 57V544m47 74V503"/>
