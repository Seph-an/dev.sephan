  <path d="M553 404l30 30 66-75" fill="none" stroke="#6ee7b7" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#d1fae5" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle"><text x="265" y="348">ORDERS</text><text x="935" y="348">PAYMENTS</text><text x="265" y="708">INVENTORY</text><text x="935" y="708">REPORTING</text></g>
</svg>
