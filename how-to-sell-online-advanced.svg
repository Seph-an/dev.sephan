<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#020617"/>
  
  <!-- Subtle Technical Grid -->
  <pattern id="dotGrid" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#1e293b" fill-opacity="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#dotGrid)"/>

  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="centralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Isometric Filter -->
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Central Glow -->
  <circle cx="600" cy="280" r="350" fill="url(#centralGlow)"/>

  <!-- Isometric Architecture System -->
  <g transform="translate(600, 280)">
    
    <!-- Connection Lines (Circuit Traces) -->
    <path d="M-150,-80 L0,-160 L150,-80 L0,0 Z" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.2"/>
    <path d="M-300,0 L0,150 L300,0 L0,-150 Z" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.1"/>
    
    <!-- Pulsing Data Lines -->
    <path d="M-200,50 L-50,130" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="10,20" opacity="0.4">
      <animate attributeName="stroke-dashoffset" from="0" to="30" dur="2s" repeatCount="indefinite" />
    </path>
    <path d="M200,50 L50,130" stroke="#10b981" stroke-width="2" stroke-dasharray="10,20" opacity="0.4">
      <animate attributeName="stroke-dashoffset" from="30" to="0" dur="2.5s" repeatCount="indefinite" />
    </path>

    <!-- Core Engine (Central Hub) -->
    <g transform="translate(0, 0)">
      <!-- Isometric Cube/Hub -->
      <path d="M0,-60 L52,-30 L0,0 L-52,-30 Z" fill="#10b981" fill-opacity="0.9"/>
      <path d="M0,0 L52,-30 L52,30 L0,60 Z" fill="#059669"/>
      <path d="M0,0 L-52,-30 L-52,30 L0,60 Z" fill="#047857"/>
      <path d="M0,-60 L52,-30 L0,0 L-52,-30 Z" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3"/>
      
      <!-- Internal Logic Symbols -->
      <text y="5" font-family="monospace" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">{ API }</text>
    </g>

    <!-- Satellite Nodes -->
    
    <!-- Payment Rail Node (Left) -->
    <g transform="translate(-180, -40)">
      <path d="M0,-30 L26,-15 L0,0 L-26,-15 Z" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <path d="M0,0 L26,-15 L26,15 L0,30 Z" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
      <path d="M0,0 L-26,-15 L-26,15 L0,30 Z" fill="#020617" stroke="#10b981" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="0" cy="0" r="8" fill="#10b981" filter="url(#glowFilter)" opacity="0.6"/>
      <text y="45" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="middle" font-weight="bold">PAYMENT RAILS</text>
    </g>

    <!-- Inventory/DB Node (Right) -->
    <g transform="translate(180, -40)">
      <path d="M0,-30 L26,-15 L0,0 L-26,-15 Z" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
      <path d="M0,0 L26,-15 L26,15 L0,30 Z" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5"/>
      <path d="M0,0 L-26,-15 L-26,15 L0,30 Z" fill="#020617" stroke="#0ea5e9" stroke-width="1" stroke-opacity="0.5"/>
      <rect x="-6" y="-6" width="12" height="12" fill="#0ea5e9" filter="url(#glowFilter)" opacity="0.6"/>
      <text y="45" font-family="sans-serif" font-size="10" fill="#0ea5e9" text-anchor="middle" font-weight="bold">DATA OPS</text>
    </g>

    <!-- Security Layer (Bottom) -->
    <g transform="translate(0, 120)">
      <path d="M0,-20 L80,0 L0,20 L-80,0 Z" fill="#1e293b" fill-opacity="0.5" stroke="#f43f5e" stroke-width="1" stroke-dasharray="4,2"/>
      <path d="M-10,-10 h20 v20 h-20 Z" fill="none" stroke="#f43f5e" stroke-width="2"/>
      <text y="35" font-family="sans-serif" font-size="10" fill="#f43f5e" text-anchor="middle" font-weight="bold">HARDENED SECURITY</text>
    </g>
  </g>

  <!-- Title Section -->
  <g transform="translate(600, 520)">
    <rect x="-350" y="-40" width="700" height="100" rx="15" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.05"/>
    <text y="20" font-family="sans-serif" font-size="56" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">
      How to Sell Things Online
    </text>
    <text y="55" font-family="sans-serif" font-size="20" font-weight="500" fill="#10b981" text-anchor="middle" letter-spacing="4" text-transform="uppercase">
      The Technical Infrastructure of E-commerce
    </text>
  </g>

  <!-- Subtle Binary/Code Overlay -->
  <text x="50" y="100" font-family="monospace" font-size="10" fill="#1e293b" fill-opacity="0.5" transform="rotate(-90 50 100)">
    01010111 01000101 01000010 01010011 01000101 01000011
  </text>
  <text x="1150" y="100" font-family="monospace" font-size="10" fill="#1e293b" fill-opacity="0.5" transform="rotate(90 1150 100)">
    API_RESPONSE_200_OK_ORDER_PROCESSED
  </text>
</svg>
